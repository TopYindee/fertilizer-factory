(sheetMap\x5btabId\x5d) \x7b\\n        loadTable(sheetMap\x5btabId\x5d, 1);\\n      \x7d\\n    \x7d\\n\\n    function handleError(err) \x7b\\n      alert(\x27เกิดข้อผิดพลาดจาก Server: \x27 + (err.message || err));\\n    \x7d\\n\\n    \\n    function escapeHtml(str) \x7b\\n      if (str \x3d\x3d\x3d null || str \x3d\x3d\x3d undefined) return \x27\x27;\\n      return String(str)\\n        .replace(\/\x26\/g, \x27\x26amp;\x27)\\n        .replace(\/\x3c\\\/g, \x27\x26lt;\x27)\\n        .replace(\/\x3e\/g, \x27\x26gt;\x27)\\n        .replace(\/\\\x22\/g, \x27\x26quot;\x27)\\n        .replace(\/\x27\/g, \x27\x26#39;\x27);\\n    \x7d\\n\\n    function loadAutoIds() \x7b\\n      google.script.run.withFailureHandler(handleError).withSuccessHandler(id \x3d\x3e document.getElementById(\x27rm-code\x27).value \x3d id).getNextAutoId(\x27RM-\x27, \x27RawMaterials\x27, 1);\\n      google.script.run.withFailureHandler(handleError).withSuccessHandler(id \x3d\x3e document.getElementById(\x27vendor-code\x27).value \x3d id).getNextAutoId(\x27VEND-\x27, \x27Vendors\x27, 1);\\n      google.script.run.withFailureHandler(handleError).withSuccessHandler(id \x3d\x3e document.getElementById(\x27cust-code\x27).value \x3d id).getNextAutoId(\x27CUST-\x27, \x27Customers\x27, 1);\\n      google.script.run.withFailureHandler(handleError).withSuccessHandler(id \x3d\x3e document.getElementById(\x27prod-code\x27).value \x3d id).getNextAutoId(\x27FG-\x27, \x27Products\x27, 1);\\n      google.script.run.withFailureHandler(handleError).withSuccessHandler(id \x3d\x3e document.getElementById(\x27pkg-code\x27).value \x3d id).getNextAutoId(\x27PKG-\x27, \x27Packaging\x27, 1);\\n      handleWhTypeChange();\\n    \x7d\\n\\n    function handleWhTypeChange() \x7b\\n      const type \x3d document.getElementById(\x27wh-type\x27).value;\\n      let prefix \x3d \x27WH-RAW-\x27;\\n      if (type \x3d\x3d\x3d \x27โกดังสินค้าFG\x27) prefix \x3d \x27WH-FG-\x27;\\n      if (type \x3d\x3d\x3d \x27โกดังบรรจุภัณฑ์PKG\x27) prefix \x3d \x27WH-PKG-\x27;\\n      google.script.run.withFailureHandler(handleError).withSuccessHandler(id \x3d\x3e document.getElementById(\x27wh-maincode\x27).value \x3d id).getNextAutoId(prefix, \x27Warehouses\x27, 2);\\n      generateDynamicZoneInputs();\\n    \x7d\\n\\n    function generateDynamicZoneInputs() \x7b\\n      const count \x3d parseInt(document.getElementById(\x27wh-zone-count\x27).value, 10) || 0;\\n      const container \x3d document.getElementById(\x27subzone-inputs-container\x27);\\n      const type \x3d document.getElementById(\x27wh-type\x27).value;\\n      container.innerHTML \x3d \x27\x27;\\n\\n      if (count \x3c\x3d 0) return;\\n\\n      let html \x3d \x27\x3cdiv style\x3d\\\x22display:flex; flex-direction:column; gap:8px; background:var(--burgundy-light); padding:12px; border:1px solid var(--burgundy-border); border-radius:4px;\\\x22\x3e\x27;\\n      html +\x3d \x27\x3cdiv style\x3d\\\x22font-weight:600; color:var(--burgundy-primary); margin-bottom:4px;\\\x22\x3eระบุปริมาณจัดเก็บแยกตามโซนย่อย:\x3c\\\/div\x3e\x27;\\n\\n      for (let i \x3d 1; i \x3c\x3d count; i++) \x7b\\n        const zoneCode \x3d \x27Z\x27 + String(i).padStart(2, \x270\x27);\\n        const unitLabel \x3d (type \x3d\x3d\x3d \x27โกดังบรรจุภัณฑ์PKG\x27) ? \x27ใบ\x27 : \x27ตัน\x27;\\n\\n        html +\x3d `\\n          \x3cdiv style\x3d\\\x22display:flex; align-items:center; gap:10px; background:#fff; padding:6px 10px; border:1px solid var(--burgundy-border); border-radius:3px;\\\x22\x3e\\n            \x3cspan style\x3d\\\x22font-weight:600; min-width:45px; color:var(--burgundy-primary);\\\x22\x3e$\x7bzoneCode\x7d\x3c\\\/span\x3e\\n            \x3clabel style\x3d\\\x22margin:0;\\\x22\x3eปริมาณ ($\x7bunitLabel\x7d):\x3c\\\/label\x3e\\n            \x3cinput type\x3d\\\x22number\\\x22 class\x3d\\\x22zone-cap-input\\\x22 data-zone\x3d\\\x22$\x7bzoneCode\x7d\\\x22 placeholder\x3d\\\x220\\\x22 oninput\x3d\\\x22updateZoneDisplay(this, \x27$\x7btype\x7d\x27)\\\x22 style\x3d\\\x22width:100px;\\\x22\x3e\\n            \x3cspan class\x3d\\\x22zone-unit-display\\\x22 style\x3d\\\x22color:var(--text-muted); font-size:11px;\\\x22\x3e\x3c\\\/span\x3e\\n          \x3c\\\/div\x3e\\n        `;\\n      \x7d\\n      html +\x3d \x27\x3c\\\/div\x3e\x27;\\n      container.innerHTML \x3d html;\\n    \x7d\\n\\n    function updateZoneDisplay(input, type) \x7b\\n      const cap \x3d parseFloat(input.value) || 0;\\n      const displaySpan \x3d input.nextElementSibling;\\n\\n      if (type \x3d\x3d\x3d \x27โกดังวัตถุดิบ(แม่ปุ๋ย)\x27 || type \x3d\x3d\x3d \x27โกดังสินค้าFG\x27) \x7b\\n        const bags \x3d cap * 20;\\n        displaySpan.innerText \x3d `\x3d $\x7bcap\x7d ตัน ($\x7bbags.toLocaleString()\x7d กระสอบ 50 กก.)`;\\n      \x7d else if (type \x3d\x3d\x3d \x27โกดังบรรจุภัณฑ์PKG\x27) \x7b\\n        displaySpan.innerText \x3d `\x3d $\x7bcap.toLocaleString()\x7d ใบ`;\\n      \x7d\\n    \x7d\\n\\n    function submitWarehouseForm() \x7b\\n      const type \x3d document.getElementById(\x27wh-type\x27).value;\\n      const mainCode \x3d document.getElementById(\x27wh-maincode\x27).value;\\n      const inputs \x3d document.querySelectorAll(\x27.zone-cap-input\x27);\\n\\n      if (inputs.length \x3d\x3d\x3d 0) \x7b\\n        alert(\x27กรุณาระบุจำนวนโซนย่อย\x27);\\n        return;\\n      \x7d\\n\\n      const zoneList \x3d \x5b\x5d;\\n      inputs.forEach(input \x3d\x3e \x7b\\n        const zoneCode \x3d input.dataset.zone;\\n        const cap \x3d parseFloat(input.value) || 0;\\n        let unitInfo \x3d \x27\x27;\\n\\n        if (type \x3d\x3d\x3d \x27โกดังวัตถุดิบ(แม่ปุ๋ย)\x27 || type \x3d\x3d\x3d \x27โกดังสินค้าFG\x27) \x7b\\n          unitInfo \x3d `$\x7bcap\x7d ตัน ($\x7b(cap * 20).toLocaleString()\x7d กระสอบ 50 กก.)`;\\n        \x7d else \x7b\\n          unitInfo \x3d `$\x7bcap.toLocaleString()\x7d ใบ`;\\n        \x7d\\n\\n        zoneList.push(\x7b\\n          zoneCode: zoneCode,\\n          capacity: cap,\\n          unitInfo: unitInfo\\n        \x7d);\\n      \x7d);\\n\\n      google.script.run.withFailureHandler(handleError).withSuccessHandler(res \x3d\x3e \x7b\\n        alert(\x27บันทึกข้อมูลโกดังแยกโซนย่อยเรียบร้อยแล้ว\x27);\\n        document.getElementById(\x27form-warehouse\x27).reset();\\n        document.getElementById(\x27subzone-inputs-container\x27).innerHTML \x3d \x27\x27;\\n        handleWhTypeChange();\\n        loadTable(\x27Warehouses\x27, 1);\\n      \x7d).saveWarehouseBatch(type, mainCode, zoneList);\\n    \x7d\\n\\n    function loadDropdowns() \x7b\\n      google.script.run.withFailureHandler(handleError).withSuccessHandler(data \x3d\x3e \x7b\\n        if (!data) return;\\n        const vendorSelect \x3d document.getElementById(\x27dd-pkg-vendor\x27);\\n        if (vendorSelect) \x7b\\n          vendorSelect.innerHTML \x3d \x27\x3coption value\x3d\\\x22\\\x22\x3e-- เลือกจาก Vendor --\x3c\\\/option\x3e\x27;\\n          (data.vendors || \x5b\x5d).forEach(v \x3d\x3e \x7b\\n            const safe \x3d escapeHtml(v);\\n            vendorSelect.innerHTML +\x3d `\x3coption value\x3d\\\x22$\x7bsafe\x7d\\\x22\x3e$\x7bsafe\x7d\x3c\\\/option\x3e`;\\n          \x7d);\\n        \x7d\\n\\n        const fgSelect \x3d document.getElementById(\x27dd-pkg-fg\x27);\\n        if (fgSelect) \x7b\\n          fgSelect.innerHTML \x3d \x27\x3coption value\x3d\\\x22\\\x22\x3e-- เลือกจาก FG List --\x3c\\\/option\x3e\x27;\\n          (data.fgList || \x5b\x5d).forEach(fg \x3d\x3e \x7b\\n            const safe \x3d escapeHtml(fg);\\n            fgSelect.innerHTML +\x3d `\x3coption value\x3d\\\x22$\x7bsafe\x7d\\\x22\x3e$\x7bsafe\x7d\x3c\\\/option\x3e`;\\n          \x7d);\\n        \x7d\\n      \x7d).getDropdownData();\\n    \x7d\\n\\n    function submitForm(sheetName, formId) \x7b\\n      const form \x3d document.getElementById(formId);\\n      const formData \x3d new FormData(form);\\n      const values \x3d \x5b\x5d;\\n\\n      for (let \x5bkey, val\x5d of formData.entries()) \x7b\\n        values.push(val);\\n      \x7d\\n\\n      const isEditing \x3d !!editingIds\x5bsheetName\x5d;\\n\\n      const onDone \x3d () \x3d\x3e \x7b\\n        alert(isEditing ? \x27แก้ไขข้อมูลเรียบร้อยแล้ว\x27 : \x27บันทึกข้อมูลเรียบร้อยแล้ว\x27);\\n        form.reset();\\n        delete editingIds\x5bsheetName\x5d;\\n        const btn \x3d form.querySelector(\x27.btn-primary\x27);\\n        if (btn) btn.innerText \x3d \x27บันทึกข้อมูล\x27;\\n        loadAutoIds();\\n        loadDropdowns();\\n        loadTable(sheetName, currentPages\x5bsheetName\x5d || 1);\\n      \x7d;\\n\\n      if (isEditing) \x7b\\n        google.script.run.withFailureHandler(handleError).withSuccessHandler(onDone).updateRecord(sheetName, editingIds\x5bsheetName\x5d, values);\\n      \x7d else \x7b\\n        google.script.run.withFailureHandler(handleError).withSuccessHandler(onDone).saveRecord(sheetName, values);\\n      \x7d\\n    \x7d\\n\\n    \/\/ เปิดข้อมูลเดิมขึ้นมาแก้ในฟอร์ม \\u2014 ค้นหาจาก ID เท่านั้น ไม่อิงตำแหน่งแถวที่แสดงผล\\n    function editRecordUI(sheetName, id) \x7b\\n      const rows \x3d currentTableData\x5bsheetName\x5d || \x5b\x5d;\\n      const row \x3d rows.find(r \x3d\x3e String(r\x5b0\x5d) \x3d\x3d\x3d String(id));\\n      if (!row) \x7b alert(\x27ไม่พบข้อมูล\x27); return; \x7d\\n\\n      if (sheetName \x3d\x3d\x3d \x27Warehouses\x27) \x7b editWarehouseZone(id, row); return; \x7d\\n\\n      const map \x3d EDIT_FIELD_MAP\x5bsheetName\x5d;\\n      if (!map) return;\\n\\n      const form \x3d document.getElementById(map.formId);\\n      \/\/ row \x3d \x5bID, ...ข้อมูลคอลัมน์กลาง..., timestamp\x5d -\x3e ตัด ID (ต้น) กับ timestamp (ท้าย) ออก\\n      const values \x3d row.slice(1, row.length - 1);\\n      map.fields.forEach((fname, idx) \x3d\x3e \x7b\\n        const el \x3d form.elements\x5bfname\x5d;\\n        if (el) el.value \x3d values\x5bidx\x5d !\x3d\x3d undefined ? values\x5bidx\x5d : \x27\x27;\\n      \x7d);\\n\\n      editingIds\x5bsheetName\x5d \x3d id;\\n      const btn \x3d form.querySelector(\x27.btn-primary\x27);\\n      if (btn) btn.innerText \x3d \x27บันทึกการแก้ไข (ID: \x27 + id + \x27)\x27;\\n      form.scrollIntoView(\x7b behavior: \x27smooth\x27, block: \x27start\x27 \x7d);\\n    \x7d\\n\\n    function editWarehouseZone(id, row) \x7b\\n      \/\/ row \x3d \x5bID, ประเภท, รหัสโกดังหลัก, โซนย่อย, ปริมาณ, หน่วยนับ\/แปลงหน่วย, timestamp\x5d\\n      const type \x3d row\x5b1\x5d, mainCode \x3d row\x5b2\x5d, zoneCode \x3d row\x5b3\x5d, currentCap \x3d row\x5b4\x5d;\\n      const input \x3d prompt(\x27แก้ไขปริมาณจัดเก็บโซน \x27 + zoneCode + \x27 (ปัจจุบัน: \x27 + currentCap + \x27)\x27, currentCap);\\n      if (input \x3d\x3d\x3d null) return;\\n\\n      const newCap \x3d parseFloat(input) || 0;\\n      const unitInfo \x3d (type \x3d\x3d\x3d \x27โกดังวัตถุดิบ(แม่ปุ๋ย)\x27 || type \x3d\x3d\x3d \x27โกดังสินค้าFG\x27)\\n        ? `$\x7bnewCap\x7d ตัน ($\x7b(newCap * 20).toLocaleString()\x7d กระสอบ 50 กก.)`\\n        : `$\x7bnewCap.toLocaleString()\x7d ใบ`;\\n\\n      google.script.run.withFailureHandler(handleError).withSuccessHandler(res \x3d\x3e \x7b\\n        if (res \x26\x26 res.success) \x7b\\n          alert(\x27แก้ไขโซน \x27 + zoneCode + \x27 เรียบร้อยแล้ว\x27);\\n          loadTable(\x27Warehouses\x27, currentPages\x5b\x27Warehouses\x27\x5d || 1);\\n        \x7d else \x7b\\n          alert(res \x26\x26 res.message ? res.message : \x27ไม่พบข้อมูลที่ต้องการแก้ไข\x27);\\n        \x7d\\n      \x7d).updateRecord(\x27Warehouses\x27, id, \x5btype, mainCode, zoneCode, newCap, unitInfo\x5d);\\n    \x7d\\n\\n    function deleteRecordUI(sheetName, id) \x7b\\n      if (!confirm(\x27ยืนยันการลบข้อมูล ID: \x27 + id + \x27 ? การลบนี้ไม่สามารถกู้คืนได้\x27)) return;\\n      google.script.run.withFailureHandler(handleError).withSuccessHandler(res \x3d\x3e \x7b\\n        if (res \x26\x26 res.success) \x7b\\n          loadTable(sheetName, currentPages\x5bsheetName\x5d || 1);\\n        \x7d else \x7b\\n          alert(res \x26\x26 res.message ? res.message : \x27ไม่พบข้อมูลที่ต้องการลบ\x27);\\n        \x7d\\n      \x7d).deleteRecord(sheetName, id);\\n    \x7d\\n\\n    function loadTable(sheetName, page) \x7b\\n      currentPages\x5bsheetName\x5d \x3d page;\\n      google.script.run.withFailureHandler(handleError).withSuccessHandler(data \x3d\x3e renderTable(sheetName, data)).getMasterData(sheetName, page, 20);\\n    \x7d\\n\\n    function renderTable(sheetName, data) \x7b\\n      const container \x3d document.getElementById(\x27table-\x27 + sheetName);\\n      if (!container) return;\\n\\n      currentTableData\x5bsheetName\x5d \x3d data.rows || \x5b\x5d;\\n\\n      if (!data || !data.rows || data.rows.length \x3d\x3d\x3d 0) \x7b\\n        container.innerHTML \x3d \x27\x3cdiv style\x3d\\\x22margin-top:10px; color:#888;\\\x22\x3eไม่พบข้อมูลในระบบ\x3c\\\/div\x3e\x27;\\n        return;\\n      \x7d\\n\\n      let html \x3d \x27\x3cdiv class\x3d\\\x22table-container\\\x22\x3e\x3ctable\x3e\x3cthead\x3e\x3ctr\x3e\x27;\\n      data.headers.forEach(h \x3d\x3e html +\x3d `\x3cth\x3e$\x7bescapeHtml(h)\x7d\x3c\\\/th\x3e`);\\n      html +\x3d \x27\x3cth\x3eจัดการ\x3c\\\/th\x3e\x27;\\n      html +\x3d \x27\x3c\\\/tr\x3e\x3c\\\/thead\x3e\x3ctbody\x3e\x27;\\n\\n      data.rows.forEach(row \x3d\x3e \x7b\\n        const id \x3d row\x5b0\x5d;\\n        html +\x3d \x27\x3ctr\x3e\x27;\\n        row.forEach(cell \x3d\x3e html +\x3d `\x3ctd\x3e$\x7bescapeHtml(cell)\x7d\x3c\\\/td\x3e`);\\n        html +\x3d `\x3ctd style\x3d\\\x22white-space:nowrap;\\\x22\x3e\\n          \x3cbutton class\x3d\\\x22page-btn\\\x22 onclick\x3d\\\x22editRecordUI(\x27$\x7bsheetName\x7d\x27, \x27$\x7bid\x7d\x27)\\\x22\x3eแก้ไข\x3c\\\/button\x3e\\n          \x3cbutton class\x3d\\\x22page-btn\\\x22 onclick\x3d\\\x22deleteRecordUI(\x27$\x7bsheetName\x7d\x27, \x27$\x7bid\x7d\x27)\\\x22\x3eลบ\x3c\\\/button\x3e\\n        \x3c\\\/td\x3e`;\\n        html +\x3d \x27\x3c\\\/tr\x3e\x27;\\n      \x7d);\\n\\n      html +\x3d \x27\x3c\\\/tbody\x3e\x3c\\\/table\x3e\x3c\\\/div\x3e\x27;\\n\\n      html +\x3d `\\n        \x3cdiv class\x3d\\\x22pagination\\\x22\x3e\\n          \x3cdiv\x3eแสดง $\x7bdata.rows.length\x7d จากทั้งหมด $\x7bdata.totalRecords\x7d รายการ (หน้า $\x7bdata.page\x7d\/$\x7bdata.totalPages\x7d)\x3c\\\/div\x3e\\n          \x3cdiv class\x3d\\\x22pagination-controls\\\x22\x3e\\n            \x3cbutton class\x3d\\\x22page-btn\\\x22 $\x7bdata.page \x3c\x3d 1 ? \x27disabled\x27 : \x27\x27\x7d onclick\x3d\\\x22loadTable(\x27$\x7bsheetName\x7d\x27, $\x7bdata.page - 1\x7d)\\\x22\x3eก่อนหน้า\x3c\\\/button\x3e\\n            \x3cbutton class\x3d\\\x22page-btn\\\x22 $\x7bdata.page \x3e\x3d data.totalPages ? \x27disabled\x27 : \x27\x27\x7d onclick\x3d\\\x22loadTable(\x27$\x7bsheetName\x7d\x27, $\x7bdata.page + 1\x7d)\\\x22\x3eถัดไป\x3c\\\/button\x3e\\n          \x3c\\\/div\x3e\\n        \x3c\\\/div\x3e\\n      `;\\n\\n      container.innerHTML \x3d html;\\n    \x7d\\n  \x3c\\\/script\x3e\\n\x3c\\\/body\x3e\\n\x3c\\\/html\x3e\x22,\x22ncc\x22:\x22\x7b\\\x22awhs\\\x22:true\x7d\x22\x7d", "ACHNxQwE882EzLGkE6GKpBjoMaLq:1789460128928", undefined, true , false  , "true", "https:\/\/n-s77l4f6pcghq3jt3ol6rxrvrl77w5co47i67via-0lu-script.googleusercontent.com", "https:\/\/drive.google.com\/abuse?id\x3dAAMpA0QWaYyvpet-vqW_TXrDQMYbwmBrCBHoPeiAvKxi0bzCWV44oF8QaZx6vKAEbvYi3dYuipG6qXdMXyzfV9CDlRcPXG-_6DG5Cs0-%3A0\x26docurl\x3dhttps%3A%2F%2Fscript.google.com%2Fmacros%2Fs%2FAKfycbxZ11j9-pBZxx1CTbyD-Oa060j8cAmA9aQy9Mu3Cx-ZV1626lwWVrH0350OLLugjoDwcg%2Fexec");}
